name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------- CI
  test:
    name: Lint and unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt flake8
      - name: Lint
        run: flake8 app tests --max-line-length=120
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  build:
    name: Build and push Docker image
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "image=${REGISTRY}/${IMAGE_NAME,,}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.REGISTRY }}/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------- CD
  smoke-test:
    name: Smoke test the built image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run container and hit /health
        run: |
          IMAGE="${{ needs.build.outputs.image }}"
          docker run -d --name sms -p 5000:5000 "$IMAGE"
          ./scripts/smoke_test.sh http://localhost:5000
          docker logs sms

  deploy:
    name: Deploy to Kubernetes
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    # Only runs when a KUBE_CONFIG secret (base64 kubeconfig) has been added to the repo.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
      - name: Apply manifests and roll out new image
        run: |
          # stamp the freshly built image tag into the manifest before applying
          sed -i "s|image: ghcr.io/.*|image: ${{ needs.build.outputs.image }}|" k8s/deployment.yaml
          kubectl apply -f k8s/
          kubectl -n student-mgmt rollout status deployment/sms-app --timeout=120s
