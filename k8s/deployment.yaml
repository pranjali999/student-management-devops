apiVersion: apps/v1
kind: Deployment
metadata:
  name: sms-app
  namespace: student-mgmt
  labels: { app: sms-app }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate           # zero-downtime updates
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: { app: sms-app }
  template:
    metadata:
      labels: { app: sms-app }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "5000"
    spec:
      containers:
        - name: sms-app
          # CI replaces this tag with the commit SHA (kubectl set image ...)
          image: student-management:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: sms-db-secret, key: DATABASE_URL }
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:                 # requests are required for HPA CPU math
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
